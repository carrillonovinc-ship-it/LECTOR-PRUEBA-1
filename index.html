<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LECTOR DE ASISTENCIA QR</title>

    <!-- LECTOR QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #eeeeee;

            margin: 0;

            padding: 15px;

            text-align: center;
        }


        .contenedor {

            max-width: 500px;

            margin: auto;

            background: white;

            padding: 20px;

            border-radius: 15px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }


        h1 {

            font-size: 28px;

            margin: 5px 0;

            color: #222;
        }


        .subtitulo {

            font-size: 17px;

            margin-bottom: 20px;

            color: #555;

            font-weight: bold;
        }


        #reader {

            width: 100%;

            margin-top: 15px;
        }


        #reader video {

            border-radius: 12px;
        }


        button {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 16px;

            font-size: 18px;

            font-weight: bold;

            background: #1976d2;

            color: white;

            margin-top: 10px;

            cursor: pointer;
        }


        button:hover {

            background: #1565c0;
        }


        button:disabled {

            background: #999999;

            cursor: not-allowed;
        }


        #resultado {

            margin-top: 20px;

            padding: 20px;

            border-radius: 12px;

            font-size: 20px;

            font-weight: bold;

            min-height: 70px;
        }


        .ok {

            background: #d4edda;

            color: #155724;
        }


        .error {

            background: #f8d7da;

            color: #721c24;
        }


        .aviso {

            background: #fff3cd;

            color: #856404;
        }


        .nombre {

            font-size: 25px;

            margin-top: 12px;

            line-height: 1.2;
        }


        .hora {

            font-size: 18px;

            margin-top: 10px;

            font-weight: normal;
        }


        .estado {

            font-size: 25px;

            margin-bottom: 8px;
        }


        .instruccion {

            margin-top: 15px;

            font-size: 14px;

            color: #777;
        }

    </style>

</head>


<body>


<div class="contenedor">


    <h1>📱 LECTOR QR</h1>


    <div class="subtitulo">
        CONTROL DE ASISTENCIA
    </div>


    <button
        id="botonCamara"
        onclick="iniciarCamara()">

        📷 ACTIVAR CÁMARA

    </button>


    <div id="reader"></div>


    <div
        id="resultado"
        class="aviso">

        PRESIONE "ACTIVAR CÁMARA"

    </div>


    <div class="instruccion">

        Escanee el código QR correspondiente al participante.

    </div>


</div>



<script>


// ============================================================
// CONFIGURACIÓN
// ============================================================

// PEGA AQUÍ LA URL /exec DE TU APPS SCRIPT

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbxabiLIjkp6XMFMvtwg7W3UZRjLwZnVxgTfrGNn-G4EguHn_j1ALClDQ_kUU2aGZg_4/exec";


// Variables del lector

let lector = null;

let procesando = false;


// ============================================================
// ACTIVAR CÁMARA
// ============================================================

async function iniciarCamara() {

    const boton =
        document.getElementById("botonCamara");


    boton.disabled = true;

    boton.innerText =
        "📷 ACTIVANDO CÁMARA...";


    try {


        // ----------------------------------------------------
        // Comprobar cámara
        // ----------------------------------------------------

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "El navegador no permite acceder a la cámara."
            );
        }


        // ----------------------------------------------------
        // Solicitar permiso de cámara
        // ----------------------------------------------------

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                }

            });


        // Detener esta prueba inicial

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });


        // ----------------------------------------------------
        // Crear lector QR
        // ----------------------------------------------------

        if (!lector) {

            lector =
                new Html5Qrcode("reader");

        }


        // ----------------------------------------------------
        // Iniciar lector
        // ----------------------------------------------------

        await lector.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                },

                aspectRatio: 1.0

            },


            function(codigoQR) {

                procesarQR(codigoQR);

            },


            function(errorMessage) {

                // Los errores normales del lector
                // no se muestran al usuario.

            }

        );


        // ----------------------------------------------------
        // Cámara activa
        // ----------------------------------------------------

        boton.innerText =
            "🟢 CÁMARA ACTIVA";


        mostrarMensaje(

            "AVISO",

            "📱 ESCANEE EL CÓDIGO QR",

            "",

            ""

        );


    }

    catch (error) {

        console.error(
            "Error de cámara:",
            error
        );


        boton.disabled = false;


        boton.innerText =
            "📷 ACTIVAR CÁMARA";


        mostrarMensaje(

            "ERROR",

            "❌ NO SE PUDO ACTIVAR LA CÁMARA",

            "",

            ""

        );


        hablar(
            "No se pudo activar la cámara"
        );

    }

}


// ============================================================
// PROCESAR QR
// ============================================================

function procesarQR(codigo) {


    // Evitar múltiples lecturas simultáneas

    if (procesando) {

        return;

    }


    procesando = true;


    // Obtener contenido del QR

    const ci =
        String(codigo || "").trim();


    // Si está vacío

    if (ci === "") {

        procesando = false;

        return;

    }


    // --------------------------------------------------------
    // Pausar cámara mientras se procesa
    // --------------------------------------------------------

    if (lector) {

        try {

            lector.pause(true);

        }

        catch (error) {

            console.log(error);

        }

    }


    // --------------------------------------------------------
    // Mostrar mensaje
    // --------------------------------------------------------

    mostrarMensaje(

        "AVISO",

        "🔎 VERIFICANDO...",

        "",

        ""

    );


    // --------------------------------------------------------
    // Enviar C.I.
    // --------------------------------------------------------

    enviarCI(ci);

}


// ============================================================
// ENVIAR C.I. AL APPS SCRIPT
// ============================================================

function enviarCI(ci) {


    // Crear nombre único para JSONP

    const callbackName =
        "respuestaQR_" +
        Date.now();


    // --------------------------------------------------------
    // Crear función de respuesta
    // --------------------------------------------------------

    window[callbackName] =
        function(respuesta) {

            try {

                mostrarResultado(
                    respuesta
                );

            }

            catch (error) {

                console.error(
                    error
                );

                mostrarMensaje(

                    "ERROR",

                    "❌ ERROR AL PROCESAR LA RESPUESTA",

                    "",

                    ""

                );

            }

            finally {


                // Eliminar callback

                delete window[callbackName];


                // Esperar antes del siguiente escaneo

                setTimeout(

                    function() {

                        procesando = false;


                        if (lector) {

                            try {

                                lector.resume();

                            }

                            catch (error) {

                                console.log(error);

                            }

                        }

                    },

                    3000

                );

            }

        };


    // --------------------------------------------------------
    // Crear URL
    // --------------------------------------------------------

    const url =
        URL_APPS_SCRIPT +
        "?ci=" +
        encodeURIComponent(ci) +
        "&callback=" +
        encodeURIComponent(callbackName);


    // --------------------------------------------------------
    // Crear SCRIPT JSONP
    // --------------------------------------------------------

    const script =
        document.createElement("script");


    script.src = url;


    // --------------------------------------------------------
    // Error de conexión
    // --------------------------------------------------------

    script.onerror =
        function() {


            mostrarMensaje(

                "ERROR",

                "❌ ERROR DE CONEXIÓN",

                "",

                ""

            );


            hablar(
                "Error de conexión con el sistema"
            );


            delete window[callbackName];


            setTimeout(

                function() {

                    procesando = false;


                    if (lector) {

                        try {

                            lector.resume();

                        }

                        catch (error) {

                            console.log(error);

                        }

                    }

                },

                3000

            );

        };


    // --------------------------------------------------------
    // Agregar SCRIPT
    // --------------------------------------------------------

    document.body.appendChild(script);

}


// ============================================================
// MOSTRAR RESULTADO
// ============================================================

function mostrarResultado(respuesta) {


    // --------------------------------------------------------
    // Sin respuesta
    // --------------------------------------------------------

    if (!respuesta) {

        mostrarMensaje(

            "ERROR",

            "❌ SIN RESPUESTA DEL SISTEMA",

            "",

            ""

        );


        hablar(
            "Sin respuesta del sistema"
        );


        return;

    }


    // --------------------------------------------------------
    // ASISTENCIA REGISTRADA
    // --------------------------------------------------------

    if (respuesta.estado === "OK") {


        mostrarMensaje(

            "OK",

            "✅ ASISTENCIA REGISTRADA",

            respuesta.nombre || "",

            respuesta.hora || ""

        );


        hablar(

            "Asistencia registrada. " +
            (respuesta.nombre || "")

        );


        return;

    }


    // --------------------------------------------------------
    // YA REGISTRADO
    // --------------------------------------------------------

    if (respuesta.estado === "YA") {


        mostrarMensaje(

            "AVISO",

            "⚠️ ASISTENCIA YA REGISTRADA",

            respuesta.nombre || "",

            ""

        );


        hablar(

            "Asistencia ya registrada. " +
            (respuesta.nombre || "")

        );


        return;

    }


    // --------------------------------------------------------
    // PARTICIPANTE NO ENCONTRADO
    // --------------------------------------------------------

    mostrarMensaje(

        "ERROR",

        "❌ " +
        (
            respuesta.mensaje ||
            "ERROR"
        ),

        "",

        ""

    );


    hablar(

        respuesta.mensaje ||
        "Error"

    );

}


// ============================================================
// MOSTRAR MENSAJE
// ============================================================

function mostrarMensaje(

    tipo,
    mensaje,
    nombre,
    hora

) {


    const resultado =
        document.getElementById(
            "resultado"
        );


    // --------------------------------------------------------
    // Limpiar clases
    // --------------------------------------------------------

    resultado.className = "";


    // --------------------------------------------------------
    // Aplicar color
    // --------------------------------------------------------

    if (tipo === "OK") {

        resultado.classList.add(
            "ok"
        );

    }

    else if (tipo === "ERROR") {

        resultado.classList.add(
            "error"
        );

    }

    else {

        resultado.classList.add(
            "aviso"
        );

    }


    // --------------------------------------------------------
    // Mensaje principal
    // --------------------------------------------------------

    let html =

        '<div class="estado">' +

        escaparHTML(mensaje) +

        '</div>';


    // --------------------------------------------------------
    // Nombre
    // --------------------------------------------------------

    if (nombre) {

        html +=

            '<div class="nombre">' +

            escaparHTML(nombre) +

            '</div>';

    }


    // --------------------------------------------------------
    // Hora
    // --------------------------------------------------------

    if (hora) {

        html +=

            '<div class="hora">' +

            '🕐 ' +

            escaparHTML(hora) +

            '</div>';

    }


    // --------------------------------------------------------
    // Mostrar
    // --------------------------------------------------------

    resultado.innerHTML =
        html;

}


// ============================================================
// PROTEGER TEXTO HTML
// ============================================================

function escaparHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ============================================================
// VOZ
// ============================================================

function hablar(texto) {


    try {


        if (
            !("speechSynthesis" in window)
        ) {

            return;

        }


        // Detener voz anterior

        window.speechSynthesis.cancel();


        // Crear voz

        const voz =
            new SpeechSynthesisUtterance(
                texto
            );


        voz.lang =
            "es-ES";


        voz.rate =
            0.95;


        voz.pitch =
            1;


        // Reproducir

        window.speechSynthesis.speak(
            voz
        );


    }

    catch (error) {

        console.log(
            "Error de voz:",
            error
        );

    }

}


// ============================================================
// LIMPIAR RECURSOS AL SALIR
// ============================================================

window.addEventListener(
    "beforeunload",
    function() {

        if (lector) {

            try {

                lector.stop();

            }

            catch (error) {

                console.log(error);

            }

        }

    }
);

</script>


</body>

</html>
