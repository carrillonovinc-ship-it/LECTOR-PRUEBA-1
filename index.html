<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LECTOR DE ASISTENCIA QR</title>

    <script src="https://unpkg.com/html5-qrcode"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,.15);
        }

        h1 {
            font-size: 28px;
            margin: 5px 0;
        }

        .subtitulo {
            font-size: 17px;
            margin-bottom: 20px;
            color: #555;
            font-weight: bold;
        }

        #reader {
            width: 100%;
            margin-top: 15px;
        }

        #reader video {
            width: 100% !important;
            border-radius: 12px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background: #1976d2;
            color: white;
            margin-top: 10px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
        }

        #resultado {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            min-height: 70px;
        }

        .ok {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .aviso {
            background: #fff3cd;
            color: #856404;
        }

        .nombre {
            font-size: 25px;
            margin-top: 12px;
        }

        .hora {
            font-size: 18px;
            margin-top: 10px;
            font-weight: normal;
        }

        .estado {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .ayuda {
            margin-top: 15px;
            font-size: 14px;
            color: #777;
            line-height: 1.5;
        }

    </style>

</head>


<body>


<div class="contenedor">

    <h1>📱 LECTOR QR</h1>

    <div class="subtitulo">
        CONTROL DE ASISTENCIA
    </div>


    <button
        id="botonCamara"
        onclick="iniciarCamara()">

        📷 ACTIVAR CÁMARA

    </button>


    <div id="reader"></div>


    <div
        id="resultado"
        class="aviso">

        PRESIONE "ACTIVAR CÁMARA"

    </div>


    <div class="ayuda">

        Permita el acceso a la cámara cuando el navegador lo solicite.

    </div>

</div>



<script>


// ============================================================
// CONFIGURACIÓN
// ============================================================

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbxabiLIjkp6XMFMvtwg7W3UZRjLwZnVxgTfrGNn-G4EguHn_j1ALClDQ_kUU2aGZg_4/exec";


let lector = null;

let procesando = false;

let camaraActiva = false;


// ============================================================
// VERIFICAR QUE LA LIBRERÍA QR ESTÉ CARGADA
// ============================================================

function verificarLibreria() {

    if (
        typeof Html5Qrcode === "undefined"
    ) {

        mostrarMensaje(
            "ERROR",
            "❌ NO SE PUDO CARGAR EL LECTOR QR",
            "",
            ""
        );

        return false;
    }

    return true;
}


// ============================================================
// ACTIVAR CÁMARA
// ============================================================

async function iniciarCamara() {

    const boton =
        document.getElementById("botonCamara");


    try {

        boton.disabled = true;

        boton.innerText =
            "📷 PREPARANDO CÁMARA...";


        mostrarMensaje(
            "AVISO",
            "🔐 SOLICITANDO PERMISO DE CÁMARA...",
            "",
            ""
        );


        // ----------------------------------------------------
        // VERIFICAR LIBRERÍA
        // ----------------------------------------------------

        if (!verificarLibreria()) {

            boton.disabled = false;

            boton.innerText =
                "📷 ACTIVAR CÁMARA";

            return;
        }


        // ----------------------------------------------------
        // VERIFICAR HTTPS
        // ----------------------------------------------------

        if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost"
        ) {

            throw new Error(
                "La cámara requiere HTTPS. Abra la página desde GitHub Pages."
            );
        }


        // ----------------------------------------------------
        // VERIFICAR API DE CÁMARA
        // ----------------------------------------------------

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Este navegador no permite utilizar la cámara."
            );
        }


        // ----------------------------------------------------
        // PEDIR PERMISO
        // ----------------------------------------------------

        const prueba =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: false

            });


        // Detener cámara de prueba

        prueba
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });


        mostrarMensaje(
            "AVISO",
            "📷 BUSCANDO CÁMARAS...",
            "",
            ""
        );


        // ----------------------------------------------------
        // OBTENER CÁMARAS
        // ----------------------------------------------------

        const camaras =
            await Html5Qrcode.getCameras();


        if (
            !camaras ||
            camaras.length === 0
        ) {

            throw new Error(
                "No se encontró ninguna cámara disponible."
            );
        }


        // ----------------------------------------------------
        // SELECCIONAR CÁMARA
        // ----------------------------------------------------

        let camaraSeleccionada =
            camaras[0];


        // Intentar encontrar cámara trasera

        for (
            let i = 0;
            i < camaras.length;
            i++
        ) {

            const nombre =
                (
                    camaras[i].label ||
                    ""
                ).toLowerCase();


            if (
                nombre.includes("back") ||
                nombre.includes("rear") ||
                nombre.includes("trasera") ||
                nombre.includes("posterior")
            ) {

                camaraSeleccionada =
                    camaras[i];

                break;
            }
        }


        // ----------------------------------------------------
        // CREAR LECTOR
        // ----------------------------------------------------

        if (lector) {

            try {

                await lector.clear();

            } catch (error) {

                console.log(error);

            }

        }


        lector =
            new Html5Qrcode("reader");


        mostrarMensaje(
            "AVISO",
            "📷 INICIANDO CÁMARA...",
            "",
            ""
        );


        // ----------------------------------------------------
        // INICIAR CÁMARA REAL
        // ----------------------------------------------------

        await lector.start(

            camaraSeleccionada.id,

            {

                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                },

                aspectRatio: 1.0,

                disableFlip: false

            },


            function(codigoQR) {

                procesarQR(codigoQR);

            },


            function(errorMessage) {

                // Errores normales de búsqueda QR.
                // No mostrar.

            }

        );


        // ----------------------------------------------------
        // TODO CORRECTO
        // ----------------------------------------------------

        camaraActiva = true;


        boton.innerText =
            "🟢 CÁMARA ACTIVA";


        boton.disabled = true;


        mostrarMensaje(
            "AVISO",
            "📱 ESCANEE EL CÓDIGO QR",
            "",
            ""
        );


    }

    catch (error) {

        console.error(
            "ERROR DE CÁMARA:",
            error
        );


        camaraActiva = false;


        boton.disabled = false;

        boton.innerText =
            "📷 ACTIVAR CÁMARA";


        mostrarErrorCamara(error);

    }

}


// ============================================================
// MOSTRAR ERROR DE CÁMARA
// ============================================================

function mostrarErrorCamara(error) {

    let mensaje =
        "❌ NO SE PUDO ACTIVAR LA CÁMARA";


    if (
        error &&
        error.name === "NotAllowedError"
    ) {

        mensaje =
            "🚫 PERMISO DE CÁMARA DENEGADO";

    }


    else if (
        error &&
        error.name === "NotFoundError"
    ) {

        mensaje =
            "📷 NO SE ENCONTRÓ LA CÁMARA";

    }


    else if (
        error &&
        error.name === "NotReadableError"
    ) {

        mensaje =
            "⚠️ LA CÁMARA ESTÁ SIENDO USADA POR OTRA APLICACIÓN";

    }


    else if (
        error &&
        error.name === "SecurityError"
    ) {

        mensaje =
            "🔒 EL NAVEGADOR BLOQUEÓ LA CÁMARA";

    }


    else if (
        error &&
        error.message
    ) {

        mensaje =
            "❌ " +
            error.message;

    }


    mostrarMensaje(
        "ERROR",
        mensaje,
        "",
        ""
    );


    hablar(
        mensaje.replace(
            /[❌🚫📷⚠️🔒]/g,
            ""
        )
    );

}


// ============================================================
// PROCESAR QR
// ============================================================

function procesarQR(codigo) {

    if (procesando) {
        return;
    }


    procesando = true;


    const ci =
        String(
            codigo || ""
        ).trim();


    if (ci === "") {

        procesando = false;

        return;
    }


    // --------------------------------------------------------
    // PAUSAR LECTOR
    // --------------------------------------------------------

    if (lector) {

        try {

            lector.pause(true);

        } catch (error) {

            console.log(error);

        }

    }


    mostrarMensaje(
        "AVISO",
        "🔎 VERIFICANDO...",
        "",
        ""
    );


    enviarCI(ci);

}


// ============================================================
// ENVIAR C.I. AL APPS SCRIPT
// ============================================================

function enviarCI(ci) {


    const callbackName =
        "respuestaQR_" +
        Date.now();


    window[callbackName] =
        function(respuesta) {

            try {

                mostrarResultado(
                    respuesta
                );

            }

            catch (error) {

                mostrarMensaje(
                    "ERROR",
                    "❌ ERROR AL PROCESAR RESPUESTA",
                    "",
                    ""
                );

            }


            finally {

                delete window[callbackName];


                setTimeout(
                    function() {

                        procesando = false;


                        if (lector && camaraActiva) {

                            try {

                                lector.resume();

                            }

                            catch (error) {

                                console.log(error);

                            }

                        }

                    },
                    3000
                );

            }

        };


    const script =
        document.createElement("script");


    script.src =
        URL_APPS_SCRIPT +
        "?ci=" +
        encodeURIComponent(ci) +
        "&callback=" +
        encodeURIComponent(callbackName);


    script.onerror =
        function() {

            mostrarMensaje(
                "ERROR",
                "❌ ERROR DE CONEXIÓN CON EL SERVIDOR",
                "",
                ""
            );


            hablar(
                "Error de conexión con el sistema"
            );


            delete window[callbackName];


            setTimeout(
                function() {

                    procesando = false;


                    if (lector && camaraActiva) {

                        try {

                            lector.resume();

                        }

                        catch (error) {

                            console.log(error);

                        }

                    }

                },
                3000
            );

        };


    document.body.appendChild(
        script
    );

}


// ============================================================
// MOSTRAR RESULTADO
// ============================================================

function mostrarResultado(respuesta) {


    if (!respuesta) {

        mostrarMensaje(
            "ERROR",
            "❌ SIN RESPUESTA DEL SISTEMA",
            "",
            ""
        );

        hablar(
            "Sin respuesta del sistema"
        );

        return;
    }


    // --------------------------------------------------------
    // REGISTRADO
    // --------------------------------------------------------

    if (
        respuesta.estado === "OK"
    ) {

        mostrarMensaje(
            "OK",
            "✅ ASISTENCIA REGISTRADA",
            respuesta.nombre || "",
            respuesta.hora || ""
        );


        hablar(
            "Asistencia registrada. " +
            (respuesta.nombre || "")
        );


        return;
    }


    // --------------------------------------------------------
    // YA REGISTRADO
    // --------------------------------------------------------

    if (
        respuesta.estado === "YA"
    ) {

        mostrarMensaje(
            "AVISO",
            "⚠️ ASISTENCIA YA REGISTRADA",
            respuesta.nombre || "",
            ""
        );


        hablar(
            "Asistencia ya registrada. " +
            (respuesta.nombre || "")
        );


        return;
    }


    // --------------------------------------------------------
    // ERROR
    // --------------------------------------------------------

    mostrarMensaje(
        "ERROR",
        "❌ " +
        (
            respuesta.mensaje ||
            "ERROR"
        ),
        "",
        ""
    );


    hablar(
        respuesta.mensaje ||
        "Error"
    );

}


// ============================================================
// MOSTRAR MENSAJE
// ============================================================

function mostrarMensaje(
    tipo,
    mensaje,
    nombre,
    hora
) {


    const resultado =
        document.getElementById(
            "resultado"
        );


    resultado.className = "";


    if (
        tipo === "OK"
    ) {

        resultado.classList.add(
            "ok"
        );

    }

    else if (
        tipo === "ERROR"
    ) {

        resultado.classList.add(
            "error"
        );

    }

    else {

        resultado.classList.add(
            "aviso"
        );

    }


    let html =
        '<div class="estado">' +
        escaparHTML(mensaje) +
        '</div>';


    if (nombre) {

        html +=
            '<div class="nombre">' +
            escaparHTML(nombre) +
            '</div>';

    }


    if (hora) {

        html +=
            '<div class="hora">' +
            '🕐 ' +
            escaparHTML(hora) +
            '</div>';

    }


    resultado.innerHTML =
        html;

}


// ============================================================
// PROTEGER TEXTO
// ============================================================

function escaparHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ============================================================
// VOZ
// ============================================================

function hablar(texto) {

    try {

        if (
            !("speechSynthesis" in window)
        ) {

            return;

        }


        window.speechSynthesis.cancel();


        const voz =
            new SpeechSynthesisUtterance(
                texto
            );


        voz.lang =
            "es-ES";


        voz.rate =
            0.95;


        voz.pitch =
            1;


        window.speechSynthesis.speak(
            voz
        );

    }

    catch (error) {

        console.log(
            "Error de voz:",
            error
        );

    }

}


// ============================================================
// DETENER CÁMARA AL SALIR
// ============================================================

window.addEventListener(
    "beforeunload",
    function() {

        if (lector) {

            try {

                lector.stop();

            }

            catch (error) {

                console.log(error);

            }

        }

    }
);


</script>

</body>

</html>
